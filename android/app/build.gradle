plugins { id 'com.android.application' }
android {
    namespace 'co.rutas.seguimiento'
    compileSdk 34
    defaultConfig {
        applicationId 'co.rutas.seguimiento'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        // Firma fija para que las actualizaciones se instalen encima sin perder datos.
        app { storeFile file('firma-app.jks'); storePassword 'rutas2026'; keyAlias 'rutas'; keyPassword 'rutas2026' }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.app } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
